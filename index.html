<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>e-book 데모 (이미지 플립북)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="viewer.css?v=2" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/src/Style/stPageFlip.css" />
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <header id="topbar">
    <button id="tocBtn" class="iconBtn" aria-label="목차">☰ 목차</button>
    <div id="pageIndicator">- / -</div>
    <div id="zoomControls">
      <button id="zoomOutBtn" class="iconBtn" aria-label="축소">－</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomInBtn" class="iconBtn" aria-label="확대">＋</button>
    </div>
    <button id="fsBtn" class="iconBtn" aria-label="전체화면">⤢</button>
  </header>

  <main id="stage">
    <button id="prevBtn" class="navBtn navBtnLeft" aria-label="이전 페이지">‹</button>
    <div id="book"></div>
    <button id="nextBtn" class="navBtn navBtnRight" aria-label="다음 페이지">›</button>
  </main>

  <div id="tocOverlay"></div>
  <aside id="tocPanel">
    <div id="tocPanelHeader">
      <span>목차</span>
      <button id="tocCloseBtn" class="iconBtn" aria-label="닫기">✕</button>
    </div>
    <ul id="tocList"></ul>
  </aside>

  <script src="viewer.js?v=8"></script>
</body>
</html>
